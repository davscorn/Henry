name: MealCart iOS build

on:
  push:
    paths:
      - "MealCart/**"
      - ".github/workflows/mealcart-ios.yml"
  pull_request:
    paths:
      - "MealCart/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        working-directory: MealCart
        run: |
          set -o pipefail
          xcodebuild \
            -project MealCart.xcodeproj \
            -scheme MealCart \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build Release for device (unsigned, mimics Archive)
        working-directory: MealCart
        run: |
          set -o pipefail
          xcodebuild \
            -project MealCart.xcodeproj \
            -scheme MealCart \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
