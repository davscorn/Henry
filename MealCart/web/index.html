const AISLES = [
  ["produce", "Produce"], ["meat", "Meat & Seafood"], ["dairy", "Dairy & Eggs"], ["bakery", "Bakery & Tortillas"],
  ["pantry", "Pantry"], ["spices", "Spices, Oils & Sauces"], ["frozen", "Frozen"], ["other", "Other"]
];
const AISLE_INDEX = Object.fromEntries(AISLES.map((a, i) => [a[0], i]));
const STORES = {
  instacartAldi: { name: "Aldi via Instacart", url: t => "https://www.instacart.com/store/aldi/s?k=" + encodeURIComponent(t) },
  aldi: { name: "Aldi", url: t => "https://www.aldi.us/results?q=" + encodeURIComponent(t) },
  walmart: { name: "Walmart", url: t => "https://www.walmart.com/search?q=" + encodeURIComponent(t) },
  target: { name: "Target", url: t => "https://www.target.com/s?searchTerm=" + encodeURIComponent(t) },
  amazonFresh: { name: "Amazon Fresh", url: t => "https://www.amazon.com/s?k=" + encodeURIComponent(t) + "&i=amazonfresh" }
};
const DEFAULT_PANTRY = ["salt", "black pepper", "olive oil", "vegetable oil"];
const MEAL_BY_ID = Object.fromEntries(MEALS.map(m => [m.id, m]));
const TAGS = [...new Set(MEALS.flatMap(m => m.tags))].sort();

/* ---------- units & formatting ---------- */
const UNIT = { tsp: ["volume", 1], tbsp: ["volume", 3], cup: ["volume", 48], oz: ["weight", 1], lb: ["weight", 16] };
const kindOf = u => UNIT[u] ? UNIT[u][0] : "count";
const factorOf = u => UNIT[u] ? UNIT[u][1] : 1;
const FRACTIONS = [[0, ""], [1/8, "⅛"], [1/4, "¼"], [1/3, "⅓"], [1/2, "½"], [2/3, "⅔"], [3/4, "¾"], [1, ""]];
function fmt(v) {
  if (!(v > 0)) return "0";
  let whole = Math.floor(v);
  const r = v - whole;
  let best = FRACTIONS[0];
  for (const f of FRACTIONS) if (Math.abs(f[0] - r) < Math.abs(best[0] - r)) best = f;
  if (best[0] === 1) whole += 1;
  const sym = best[0] === 1 ? "" : best[1];
  if (whole === 0) return sym || "⅛";
  return whole + sym;
}
function unitLabel(u, amt) {
  const plural = amt > 1.0001;
  const map = { tsp: "tsp", tbsp: "tbsp", oz: "oz", lb: "lb", each: "",
    cup: plural ? "cups" : "cup", clove: plural ? "cloves" : "clove", can: plural ? "cans" : "can",
    jar: plural ? "jars" : "jar", package: plural ? "packages" : "package", bunch: plural ? "bunches" : "bunch",
    slice: plural ? "slices" : "slice" };
  return map[u] ?? u;
}
function join(amt, u) { const l = unitLabel(u, amt); return l ? fmt(amt) + " " + l : fmt(amt); }
function describe(base, kind, countUnit) {
  if (kind === "volume") return base >= 12 ? join(base / 48, "cup") : base >= 3 ? join(base / 3, "tbsp") : join(base, "tsp");
  if (kind === "weight") return base >= 16 ? join(base / 16, "lb") : join(base, "oz");
  return join(base, countUnit);
}
const norm = s => String(s).trim().toLowerCase();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- state & persistence ---------- */
const LS_KEY = "mealcart.state.v1";
function freshState() {
  return { planned: [], checked: [], pantry: DEFAULT_PANTRY.slice(), store: "instacartAldi", extras: [], notes: [], updatedAt: 0 };
}
function normalize(s) {
  const base = freshState();
  if (!s || typeof s !== "object") return base;
  const arr = (v, d) => Array.isArray(v) ? v : d;
  return {
    planned: arr(s.planned, []).filter(p => p && MEAL_BY_ID[p.id]).map(p => ({ id: p.id, servings: Math.min(16, Math.max(1, Number(p.servings) || MEAL_BY_ID[p.id].servings)) })),
    checked: arr(s.checked, []).map(String),
    pantry: arr(s.pantry, base.pantry).map(norm),
    store: STORES[s.store] ? s.store : base.store,
    extras: arr(s.extras, []).map(String),
    notes: arr(s.notes, []).filter(n => n && n.text).map(n => ({ id: String(n.id || Math.random()), date: Number(n.date) || Date.now(), text: String(n.text) })),
    updatedAt: Number(s.updatedAt) || 0
  };
}
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? normalize(JSON.parse(raw)) : null; } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }

let state = loadLocal() || freshState();
let remoteDoc = null, writing = false, writeAgain = false, writeTimer = null, synced = false;

function commit() {
  state.updatedAt = Date.now();
  saveLocal();
  if (remoteDoc) { clearTimeout(writeTimer); writeTimer = setTimeout(flushRemote, 800); }
  render();
}
async function flushRemote() {
  if (!remoteDoc) return;
  if (writing) { writeAgain = true; return; }
  writing = true;
  try { await remoteDoc.set({ state: JSON.parse(JSON.stringify(state)) }); synced = true; }
  catch (e) { synced = false; }
  writing = false;
  if (writeAgain) { writeAgain = false; flushRemote(); }
  if (current === "prefs") renderSyncBadge();
}
async function connectAccount() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") return;
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/mealcart");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    remoteDoc = ref;
    const remote = snap.exists ? (snap.data() || {}).state : null;
    if (remote && (Number(remote.updatedAt) || 0) > state.updatedAt) {
      state = normalize(remote); saveLocal(); synced = true; render();
    } else if (state.updatedAt > 0) {
      flushRemote();
    } else {
      synced = true; if (current === "prefs") renderSyncBadge();
    }
  } catch (e) { /* stay local-only */ }
}

/* ---------- domain ---------- */
const isPlanned = id => state.planned.some(p => p.id === id);
function togglePlanned(id) {
  if (isPlanned(id)) state.planned = state.planned.filter(p => p.id !== id);
  else state.planned.push({ id, servings: MEAL_BY_ID[id].servings });
  commit();
}
function toggleChecked(key) {
  const set = new Set(state.checked);
  set.has(key) ? set.delete(key) : set.add(key);
  state.checked = [...set];
  commit();
}
const extraKey = e => "extra:" + norm(e);

function buildList() {
  const pantry = new Set(state.pantry);
  const buckets = new Map();
  for (const plan of state.planned) {
    const meal = MEAL_BY_ID[plan.id];
    if (!meal) continue;
    const scale = Math.max(plan.servings, 1) / Math.max(meal.servings, 1);
    for (const ing of meal.ing) {
      const key = norm(ing.n);
      let acc = buckets.get(key);
      if (!acc) { acc = { name: cap(ing.n), aisle: ing.a, search: ing.s || ing.n, amounts: new Map(), meals: [] }; buckets.set(key, acc); }
      const kind = kindOf(ing.u);
      const uk = kind === "count" ? "count:" + ing.u : kind;
      acc.amounts.set(uk, (acc.amounts.get(uk) || 0) + ing.q * factorOf(ing.u) * scale);
      if (!acc.meals.includes(meal.name)) acc.meals.push(meal.name);
    }
  }
  const items = [];
  for (const [key, acc] of buckets) {
    const amount = [...acc.amounts].map(([uk, base]) => uk.startsWith("count:") ? describe(Math.ceil(base - 0.01), "count", uk.slice(6)) : describe(base, uk)).join(" + ");
    items.push({ key, name: acc.name, aisle: acc.aisle, amount, meals: acc.meals, search: acc.search, pantry: pantry.has(key) });
  }
  items.sort((a, b) => (AISLE_INDEX[a.aisle] - AISLE_INDEX[b.aisle]) || a.name.localeCompare(b.name));
  return items;
}
function remainingCount(items) {
  const checked = new Set(state.checked);
  return items.filter(i => !i.pantry && !checked.has(i.key)).length + state.extras.filter(e => !checked.has(extraKey(e))).length;
}
function listText(items) {
  const lines = ["MealCart shopping list", ""];
  for (const [id, title] of AISLES) {
    const inAisle = items.filter(i => !i.pantry && i.aisle === id);
    if (!inAisle.length) continue;
    lines.push(title.toUpperCase(), ...inAisle.map(i => "☐ " + i.name + " — " + i.amount), "");
  }
  if (state.extras.length) lines.push("EXTRAS", ...state.extras.map(e => "☐ " + e));
  return lines.join("\n").trim();
}
function notesText() {
  return state.notes.slice().reverse().map(n => "• [" + new Date(n.date).toLocaleString() + "] " + n.text).join("\n");
}

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>',
  house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5M6 9.5V20h12V9.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>'
};

/* ---------- views ---------- */
const TITLES = { discover: "Discover", week: "This Week", list: "Shopping List", prefs: "Settings" };
let current = "discover";
const ui = { query: "", tag: null, extraDraft: "", noteDraft: "", stapleDraft: "", confirm: null, copyText: null };
const $view = document.getElementById("view");

function mealRow(m) {
  const on = isPlanned(m.id);
  return '<article class="panel meal">' +
    '<button class="open" data-act="open" data-id="' + m.id + '" aria-label="Open ' + esc(m.name) + '">' +
      '<span class="plate" aria-hidden="true">' + m.emoji + '</span>' +
      '<span style="min-width:0"><h3>' + esc(m.name) + '</h3><span class="meta">' + m.minutes + ' min · serves ' + m.servings + ' · ' + m.ing.length + ' ingredients</span></span>' +
    '</button>' +
    '<button class="add" data-act="plan" data-id="' + m.id + '" aria-pressed="' + on + '">' + (on ? I.check + 'Added' : I.plus + 'Add') + '</button>' +
  '</article>';
}
function filteredMeals() {
  const q = norm(ui.query);
  return MEALS.filter(m => (!ui.tag || m.tags.includes(ui.tag)) &&
    (!q || m.name.toLowerCase().includes(q) || m.ing.some(i => i.n.includes(q))));
}
function renderMealList() {
  const list = filteredMeals();
  const el = document.getElementById("meals");
  const count = document.getElementById("mealcount");
  if (count) count.textContent = list.length + (list.length === 1 ? " meal" : " meals");
  if (el) el.innerHTML = list.length ? list.map(mealRow).join("") :
    '<div class="empty"><h2>No matches</h2><p>Nothing matches “' + esc(ui.query) + '”. Try an ingredient like chicken or rice.</p></div>';
}
function viewDiscover() {
  $view.innerHTML =
    '<input class="field" id="q" type="search" placeholder="Search meals or ingredients" autocomplete="off" value="' + esc(ui.query) + '">' +
    '<div class="chips" role="group" aria-label="Filter by tag">' +
      '<button class="chip" data-act="tag" data-tag="" aria-pressed="' + (!ui.tag) + '">All</button>' +
      TAGS.map(t => '<button class="chip" data-act="tag" data-tag="' + esc(t) + '" aria-pressed="' + (ui.tag === t) + '">' + esc(t) + '</button>').join("") +
    '</div>' +
    '<p class="eyebrow" id="mealcount"></p>' +
    '<div class="meals" id="meals"></div>';
  renderMealList();
}

function viewWeek() {
  if (!state.planned.length) {
    $view.innerHTML = '<div class="empty"><h2>No dinners planned yet</h2><p>Pick this week’s dinners in Discover. Your shopping list builds itself.</p><a class="btn" href="#discover">Browse meals</a></div>';
    return;
  }
  const items = buildList();
  const totalMin = state.planned.reduce((s, p) => s + MEAL_BY_ID[p.id].minutes, 0);
  $view.innerHTML =
    '<div class="summary">' +
      '<div class="panel stat"><b>' + state.planned.length + '</b><span class="muted small">dinners</span></div>' +
      '<div class="panel stat"><b>' + items.filter(i => !i.pantry).length + '</b><span class="muted small">items to buy</span></div>' +
      '<div class="panel stat"><b>' + (totalMin / 60).toFixed(1).replace(/\.0$/, "") + ' h</b><span class="muted small">total cooking</span></div>' +
    '</div>' +
    '<div class="week">' + state.planned.map((p, idx) => {
      const m = MEAL_BY_ID[p.id];
      return '<article class="panel planned">' +
        '<span class="plate" aria-hidden="true" style="width:46px;height:46px;font-size:24px">' + m.emoji + '</span>' +
        '<div class="info"><button class="open" data-act="open" data-id="' + m.id + '" style="border:0;background:none;padding:0;text-align:left"><h3>' + esc(m.name) + '</h3></button>' +
        '<span class="meta">' + m.minutes + ' min</span> · <button data-act="unplan" data-id="' + m.id + '" style="border:0;background:none;padding:0;color:var(--danger);font-size:0.82rem;font-weight:600">Remove</button></div>' +
        '<div class="stepper" role="group" aria-label="Servings for ' + esc(m.name) + '">' +
          '<button data-act="serv" data-id="' + m.id + '" data-d="-1" aria-label="Fewer servings">−</button>' +
          '<output>' + p.servings + '<small>servings</small></output>' +
          '<button data-act="serv" data-id="' + m.id + '" data-d="1" aria-label="More servings">+</button>' +
        '</div></article>';
    }).join("") + '</div>' +
    '<p class="muted small" style="margin:0">Changing servings scales the amounts on your list.</p>' +
    '<a class="btn block" href="#list">View shopping list · ' + remainingCount(items) + ' to buy</a>' +
    confirmButton("clearweek", "Clear this week", "Tap again to clear meals and check-offs");
}
function confirmButton(id, label, confirmLabel) {
  const armed = ui.confirm === id;
  return '<button class="btn block danger" data-act="confirm" data-id="' + id + '">' + (armed ? confirmLabel : label) + '</button>';
}

function itemRow(i, checked) {
  const done = checked.has(i.key);
  const url = STORES[state.store].url(i.search);
  return '<div class="item' + (done ? " done" : "") + '">' +
    '<button class="check" role="checkbox" aria-checked="' + done + '" data-act="check" data-key="' + esc(i.key) + '" aria-label="' + esc(i.name) + '">' + I.check + '</button>' +
    '<div class="body"><div class="top"><span class="nm">' + esc(i.name) + '</span><span class="amt">' + esc(i.amount) + '</span></div>' +
    '<div class="from">' + esc(i.meals.join(", ")) + '</div></div>' +
    '<div class="acts">' +
      '<button class="iconbtn" data-act="have" data-key="' + esc(i.key) + '" aria-label="I already have ' + esc(i.name) + '" title="Already have it">' + I.house + '</button>' +
      '<a class="iconbtn" href="' + esc(url) + '" target="_blank" rel="noopener" aria-label="Search ' + esc(STORES[state.store].name) + ' for ' + esc(i.name) + '" title="Search ' + esc(STORES[state.store].name) + '">' + I.search + '</a>' +
    '</div></div>';
}
function storeSelect(id) {
  return '<select id="' + id + '" data-act="store">' + Object.entries(STORES).map(([k, s]) =>
    '<option value="' + k + '"' + (k === state.store ? " selected" : "") + '>' + esc(s.name) + '</option>').join("") + '</select>';
}
function viewList() {
  const items = buildList();
  if (!items.length && !state.extras.length) {
    $view.innerHTML = '<div class="empty"><h2>Your list is empty</h2><p>Add meals to this week and every ingredient lands here, combined and sorted by aisle.</p><a class="btn" href="#discover">Browse meals</a></div>';
    return;
  }
  const checked = new Set(state.checked);
  const needed = items.filter(i => !i.pantry);
  const pantryItems = items.filter(i => i.pantry);
  const total = needed.length + state.extras.length;
  const left = remainingCount(items);
  let html =
    '<div class="panel storebar"><label for="store-l">Shop at</label>' + storeSelect("store-l") + '</div>' +
    '<div style="display:grid;gap:6px"><div style="display:flex;justify-content:space-between" class="small"><span><b>' + (total - left) + '</b> of ' + total + ' in cart</span><span class="muted">' + left + ' left</span></div>' +
    '<div class="progress" aria-hidden="true"><i style="width:' + (total ? Math.round((total - left) / total * 100) : 0) + '%"></i></div></div>';
  let n = 0;
  for (const [id, title] of AISLES) {
    const inAisle = needed.filter(i => i.aisle === id);
    if (!inAisle.length) continue;
    n += 1;
    const leftHere = inAisle.filter(i => !checked.has(i.key)).length;
    html += '<section class="aisle" aria-label="' + esc(title) + '"><div class="sign"><span class="no">' + n + '</span><span class="name">' + esc(title) + '</span><span class="count">' + leftHere + ' left</span></div>' +
      '<div class="items">' + inAisle.map(i => itemRow(i, checked)).join("") + '</div></section>';
  }
  html += '<section class="aisle" aria-label="Extras"><div class="sign"><span class="no">+</span><span class="name">Extras</span><span class="count">' + state.extras.length + '</span></div><div class="items">' +
    state.extras.map((e, idx) => {
      const k = extraKey(e), done = checked.has(k);
      return '<div class="item' + (done ? " done" : "") + '">' +
        '<button class="check" role="checkbox" aria-checked="' + done + '" data-act="check" data-key="' + esc(k) + '" aria-label="' + esc(e) + '">' + I.check + '</button>' +
        '<div class="body"><div class="top"><span class="nm">' + esc(e) + '</span></div></div>' +
        '<div class="acts"><button class="iconbtn" data-act="rmextra" data-i="' + idx + '" aria-label="Remove ' + esc(e) + '">' + I.trash + '</button>' +
        '<a class="iconbtn" href="' + esc(STORES[state.store].url(e)) + '" target="_blank" rel="noopener" aria-label="Search for ' + esc(e) + '">' + I.search + '</a></div></div>';
    }).join("") +
    '<form class="item" data-form="extra"><input class="field" id="extra" placeholder="Add an item (paper towels, milk…)" autocomplete="off" value="' + esc(ui.extraDraft) + '"><button class="btn small" type="submit">Add</button></form>' +
    '</div></section>';
  if (pantryItems.length) {
    html += '<details class="panel pantry"><summary>Already in your pantry (' + pantryItems.length + ')</summary>' +
      pantryItems.map(i => '<div class="item"><div class="body"><div class="top"><span class="nm">' + esc(i.name) + '</span><span class="amt muted">' + esc(i.amount) + '</span></div></div>' +
        '<button class="btn small ghost" data-act="need" data-key="' + esc(i.key) + '">Need it</button></div>').join("") +
      '</details>';
  }
  html += '<div class="listtools"><button class="btn ghost small" data-act="copylist">Copy list</button><button class="btn ghost small" data-act="uncheck">Uncheck all</button></div>';
  if (ui.copyText !== null) {
    html += '<div class="panel copybox"><p class="small" style="margin:0">Copying is blocked here. Select the text and copy it yourself:</p><textarea class="field" id="copytext" readonly>' + esc(ui.copyText) + '</textarea></div>';
  }
  html += '<p class="muted small" style="margin:0">The house button moves an item to your pantry. The magnifier searches ' + esc(STORES[state.store].name) + ' in a new tab.</p>';
  $view.innerHTML = html;
}

function viewPrefs() {
  const notes = state.notes;
  $view.innerHTML =
    '<section class="group"><h2>Store</h2><div class="panel storebar"><label for="store-p">Preferred store</label>' + storeSelect("store-p") + '</div>' +
      '<p class="muted small">Search buttons on the list open this store’s results.</p></section>' +
    '<section class="group"><h2>Pantry staples</h2><p class="muted small">Things you always have. They stay off your shopping list. A staple must match the ingredient name, like “olive oil”.</p>' +
      '<div class="panel"><div class="staples">' + (state.pantry.length ? state.pantry.slice().sort().map(s =>
        '<span class="staple">' + esc(cap(s)) + '<button data-act="rmstaple" data-key="' + esc(s) + '" aria-label="Remove ' + esc(s) + '">' + I.x + '</button></span>').join("") : '<span class="muted small">No staples yet.</span>') + '</div>' +
      '<form class="item" style="border-top:1px solid var(--line)" data-form="staple"><input class="field" id="staple" placeholder="Add a staple, e.g. flour" autocomplete="off" value="' + esc(ui.stapleDraft) + '"><button class="btn small" type="submit">Add</button></form></div></section>' +
    '<section class="group"><h2>Feedback notes</h2><p class="muted small">Your V2 list. Write down what broke, confused you, or was missing while you shop.</p>' +
      '<form class="panel" style="display:grid;gap:8px;padding:12px" data-form="note"><textarea class="field" id="note" rows="3" placeholder="e.g. “cilantro” search at Aldi returned nothing">' + esc(ui.noteDraft) + '</textarea><button class="btn" type="submit">Save note</button></form>' +
      (notes.length ? '<div class="panel notes">' + notes.map(n => '<div class="note"><p>' + esc(n.text) + '<time>' + new Date(n.date).toLocaleDateString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + '</time></p>' +
        '<button class="iconbtn" data-act="rmnote" data-id="' + esc(n.id) + '" aria-label="Delete note">' + I.trash + '</button></div>').join("") + '</div>' +
        '<button class="btn ghost" data-act="copynotes">Copy all notes</button>' : '') +
    '</section>' +
    '<section class="group"><h2>Put it on your home screen</h2><div class="panel howto"><ol class="small">' +
      '<li>Open this page in Safari on your iPhone.</li><li>Tap the Share button, then <b>Add to Home Screen</b>.</li><li>Name it MealCart and tap <b>Add</b>.</li></ol>' +
      '<span class="sync" id="sync"></span></div></section>' +
    '<section class="group"><h2>Start over</h2>' + confirmButton("reset", "Reset all data", "Tap again to erase plan, list, pantry and notes") + '</section>';
  renderSyncBadge();
}
function renderSyncBadge() {
  const el = document.getElementById("sync");
  if (!el) return;
  el.className = "sync" + (remoteDoc && synced ? " on" : "");
  el.innerHTML = "<i></i>" + (remoteDoc && synced ? "Saved to your account, so it syncs between devices" : "Saved on this device");
}

function render() {
  document.getElementById("title").textContent = TITLES[current];
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === current ? "page" : "false"));
  const items = buildList();
  const bw = document.getElementById("b-week"), bl = document.getElementById("b-list");
  bw.hidden = !state.planned.length; bw.textContent = state.planned.length;
  const left = remainingCount(items);
  bl.hidden = !left; bl.textContent = left;
  const active = document.activeElement && document.activeElement.id;
  ({ discover: viewDiscover, week: viewWeek, list: viewList, prefs: viewPrefs })[current]();
  if (active && ["q", "extra", "note", "staple"].includes(active)) {
    const el = document.getElementById(active);
    if (el) { el.focus(); if (el.setSelectionRange && el.type !== "search") el.setSelectionRange(el.value.length, el.value.length); }
  }
  if (openMealId) renderSheet();
}

/* ---------- meal sheet ---------- */
let openMealId = null;
const $sheet = document.getElementById("sheet");
function renderSheet() {
  const m = MEAL_BY_ID[openMealId];
  if (!m) { $sheet.hidden = true; return; }
  const on = isPlanned(m.id);
  $sheet.hidden = false;
  $sheet.innerHTML = '<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
    '<div class="grab"></div>' +
    '<div class="sheet-head"><span class="plate" aria-hidden="true">' + m.emoji + '</span><div style="min-width:0"><h2 id="sheet-title">' + esc(m.name) + '</h2><span class="meta">' + m.minutes + ' min · serves ' + m.servings + ' · ' + esc(m.tags.join(" · ")) + '</span></div>' +
    '<button class="iconbtn" data-act="close" aria-label="Close" style="margin-left:auto;align-self:flex-start">' + I.x + '</button></div>' +
    '<p style="margin:0">' + esc(m.summary) + '</p>' +
    '<button class="btn block' + (on ? " danger" : "") + '" data-act="plan" data-id="' + m.id + '">' + (on ? "Remove from this week" : "Add to this week") + '</button>' +
    '<div class="group"><p class="eyebrow">Ingredients</p><div class="panel ing">' + m.ing.map(i =>
      '<div><span>' + esc(cap(i.n)) + '</span><span>' + esc(describe(i.q * factorOf(i.u), kindOf(i.u), i.u)) + '</span></div>').join("") + '</div></div>' +
    '<div class="group"><p class="eyebrow">Steps</p><ol class="steps-ol">' + m.steps.map(s => '<li>' + esc(s) + '</li>').join("") + '</ol></div>' +
  '</div></div>';
}
function openSheet(id) { openMealId = id; renderSheet(); const c = $sheet.querySelector(".sheet .iconbtn"); if (c) c.focus(); }
function closeSheet() { openMealId = null; $sheet.hidden = true; $sheet.innerHTML = ""; }

/* ---------- feedback ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}
function copy(text, okMsg) {
  const fallback = () => { ui.copyText = text; render(); const ta = document.getElementById("copytext"); if (ta) { ta.focus(); ta.select(); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => { ui.copyText = null; toast(okMsg); }, fallback);
  } else fallback();
}
let confirmTimer;

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "close") { if (e.target === el || el.tagName === "BUTTON") closeSheet(); return; }
  switch (act) {
    case "open": openSheet(el.dataset.id); break;
    case "plan": {
      const was = isPlanned(el.dataset.id);
      togglePlanned(el.dataset.id);
      toast(was ? "Removed from this week" : "Added to this week");
      break;
    }
    case "unplan": togglePlanned(el.dataset.id); break;
    case "tag": ui.tag = el.dataset.tag || null; viewDiscover(); break;
    case "serv": {
      const p = state.planned.find(x => x.id === el.dataset.id);
      if (p) { p.servings = Math.min(16, Math.max(1, p.servings + Number(el.dataset.d))); commit(); }
      break;
    }
    case "check": toggleChecked(el.dataset.key); break;
    case "have": state.pantry = [...new Set([...state.pantry, el.dataset.key])]; commit(); toast("Moved to your pantry"); break;
    case "need": state.pantry = state.pantry.filter(p => p !== el.dataset.key); commit(); break;
    case "rmstaple": state.pantry = state.pantry.filter(p => p !== el.dataset.key); commit(); break;
    case "rmextra": {
      const ex = state.extras[Number(el.dataset.i)];
      state.extras = state.extras.filter((_, i) => i !== Number(el.dataset.i));
      state.checked = state.checked.filter(k => k !== extraKey(ex));
      commit(); break;
    }
    case "uncheck": state.checked = []; commit(); break;
    case "copylist": copy(listText(buildList()), "List copied"); break;
    case "copynotes": copy(notesText(), "Notes copied"); break;
    case "rmnote": state.notes = state.notes.filter(n => n.id !== el.dataset.id); commit(); break;
    case "confirm": {
      if (ui.confirm === el.dataset.id) {
        ui.confirm = null; clearTimeout(confirmTimer);
        if (el.dataset.id === "clearweek") { state.planned = []; state.checked = []; commit(); toast("Week cleared"); }
        if (el.dataset.id === "reset") { const at = state.updatedAt; state = freshState(); state.updatedAt = at; ui.copyText = null; commit(); toast("Everything reset"); }
      } else {
        ui.confirm = el.dataset.id; render();
        clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { ui.confirm = null; render(); }, 4000);
      }
      break;
    }
  }
});
document.addEventListener("change", e => {
  if (e.target.dataset.act === "store") { state.store = e.target.value; commit(); }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q") { ui.query = e.target.value; renderMealList(); }
  if (id === "extra") ui.extraDraft = e.target.value;
  if (id === "note") ui.noteDraft = e.target.value;
  if (id === "staple") ui.stapleDraft = e.target.value;
});
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  if (kind === "extra") {
    const v = ui.extraDraft.trim();
    if (v && !state.extras.some(x => norm(x) === norm(v))) state.extras.push(v);
    ui.extraDraft = ""; commit();
    const f = document.getElementById("extra"); if (f) f.focus();
  } else if (kind === "staple") {
    const v = norm(ui.stapleDraft);
    if (v) state.pantry = [...new Set([...state.pantry, v])];
    ui.stapleDraft = ""; commit();
  } else if (kind === "note") {
    const v = ui.noteDraft.trim();
    if (!v) return;
    state.notes.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: Date.now(), text: v });
    ui.noteDraft = ""; commit(); toast("Note saved");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && openMealId) closeSheet(); });

function route() {
  const h = (location.hash || "").slice(1);
  current = TITLES[h] ? h : "discover";
  ui.confirm = null; ui.copyText = null;
  closeSheet();
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
connectAccount();
})();
</script>

</body></html>
